name: Migrate production database

# Applies pending Drizzle migrations to the production Neon database on every
# push to main, and can be run manually before/after a release.
#
# Vercel deploys the Git commit in parallel, so migrations must stay
# backwards-compatible with the code already running (expand/contract):
# add columns/tables first, deploy, then remove the old shape later.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        run: pnpm db:migrate
